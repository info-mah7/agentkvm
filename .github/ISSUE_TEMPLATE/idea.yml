name: Idea or feature request
description: Suggest something
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the feature. Most good changes here started as someone describing a machine they could not drive.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
